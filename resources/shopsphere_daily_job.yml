resources:
  jobs:
    shopsphere_daily:
      name: shopsphere-daily-${bundle.target}
      description: >-
        Daily ShopSphere run: bronze ingestion -> medallion pipeline -> data-quality checks ->
        dashboard refresh, plus churn features -> nightly churn scoring. Clickstream is not
        included while the Event Hubs namespace is deleted. All notebook tasks share one
        single-node ML-runtime cluster: the regional quota is 4 cores, so two clusters can't run at once.
      tags:
        project: shopsphere
      max_concurrent_runs: 1
      timeout_seconds: 7200
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Asia/Kolkata
        pause_status: ${var.schedule_status}
      email_notifications:
        on_failure:
          - ${var.alert_email}
        no_alert_for_skipped_runs: true
      parameters:
        - name: catalog
          default: ${var.catalog}
      job_clusters:
        - job_cluster_key: single_node_ml
          new_cluster:
            policy_id: ${var.cluster_policy_id}
            apply_policy_default_values: true
            spark_version: ${var.ml_spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: 0
            data_security_mode: SINGLE_USER
            single_user_name: ${workspace.current_user.userName}
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode
              project: shopsphere
      tasks:
        - task_key: bronze_autoloader
          description: Products and sellers from the landing zone (Auto Loader)
          job_cluster_key: single_node_ml
          notebook_task:
            notebook_path: ../src/ingestion/bronze/01_autoloader_products_sellers.py
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true

        - task_key: bronze_jdbc
          description: Orders, customers, payments, items, reviews from Azure SQL (JDBC)
          job_cluster_key: single_node_ml
          notebook_task:
            notebook_path: ../src/ingestion/bronze/02_jdbc_orders_customers_payments.py
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true

        - task_key: medallion_pipeline
          description: Silver and gold (Lakeflow Declarative Pipeline, serverless)
          depends_on:
            - task_key: bronze_autoloader
            - task_key: bronze_jdbc
          pipeline_task:
            pipeline_id: ${resources.pipelines.medallion.id}
            full_refresh: false
          max_retries: 1
          min_retry_interval_millis: 120000

        - task_key: quality_checks
          description: Expectation results to ops.dq_results; fails on structural problems
          depends_on:
            - task_key: medallion_pipeline
          job_cluster_key: single_node_ml
          notebook_task:
            notebook_path: ../src/pipelines/08_data_quality_report.py

        - task_key: churn_features
          description: Refresh ml.features_customer and ml.churn_labels
          depends_on:
            - task_key: medallion_pipeline
          job_cluster_key: single_node_ml
          notebook_task:
            notebook_path: ../src/ml/10_churn_features.py
          max_retries: 1
          min_retry_interval_millis: 60000

        - task_key: churn_scoring
          description: Nightly batch scoring with ml.churn_model@champion into ml.churn_predictions
          depends_on:
            - task_key: churn_features
          job_cluster_key: single_node_ml
          notebook_task:
            notebook_path: ../src/ml/14_churn_batch_scoring.py
          max_retries: 1
          min_retry_interval_millis: 60000

        - task_key: refresh_dashboard
          description: Refresh the ShopSphere Executive dashboard
          depends_on:
            - task_key: quality_checks
          dashboard_task:
            dashboard_id: ${resources.dashboards.executive.id}
            warehouse_id: ${var.warehouse_id}
