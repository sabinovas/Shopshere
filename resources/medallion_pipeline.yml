resources:
  pipelines:
    medallion:
      name: shopsphere-medallion-${bundle.target}
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      continuous: false
      channel: CURRENT
      libraries:
        - notebook:
            path: ../src/pipelines/silver.py
        - notebook:
            path: ../src/pipelines/gold.py
      configuration:
        shopsphere.catalog: ${var.catalog}
        # PII mask and regional row filter on gold.dim_customer (on since 2026-11-08, after
        # src/governance/governance.sql ran and the pipeline owner joined data_engineers)
        shopsphere.apply_governance: "true"
      event_log:
        catalog: ${var.catalog}
        schema: ops
        name: pipeline_event_log
